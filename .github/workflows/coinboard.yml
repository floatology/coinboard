name: coinboard
# Hourly: refresh the trade archives, rebuild the analytics and the page, deploy to the private Vercel project.
# Started by the "alerts" workflow's 5-minute tick when an update is due (scripts/coinboard_tick.py), and by
# "Refresh analytics" on the page. Needs these repository secrets:
#   POSITIONS_JSON  the owner's positions file (costs and quantities; never committed)
#   VERCEL_TOKEN    Vercel token that can deploy the coinboard project
#   VERCEL_PROJECT  the Vercel project name
#   SEED_REPO, SEED_TOKEN  optional: a fallback source of starting archives if both the cache and the backup release are lost
# The archives live in the Actions cache between runs (older entries are deleted, newest 3 kept); a copy goes to the
# "archive-backup" release once a day (public chain data only; the replay state with costs is left out). A small commit
# every ~40 days keeps the alerts fallback schedule enabled (GitHub switches off scheduled workflows in public
# repositories after 60 days without activity). Package versions: requirements.txt; Node.js for the wallet replay: 24.
on:
  workflow_dispatch:
concurrency:
  group: coinboard
  cancel-in-progress: true    # a newer run (the tick or the page button) replaces an older one
permissions:
  contents: write      # the keep-alive commit and the archive backup release
  actions: write       # deleting old archive caches
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Restore archives
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: data
          key: coinboard-data-${{ github.run_id }}
          restore-keys: coinboard-data-
      - name: Restore archives from the backup (only if the cache was lost)
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_REPO: ${{ secrets.SEED_REPO }}
          SEED_TOKEN: ${{ secrets.SEED_TOKEN }}
        run: |
          if gh release download archive-backup -p data.tar.zst -D /tmp 2>/dev/null; then
            zstd -dc /tmp/data.tar.zst | tar -x && rm /tmp/data.tar.zst
          elif [ -n "$SEED_TOKEN" ]; then
            git clone -q --depth 1 --branch coinboard-seed "https://x-access-token:${SEED_TOKEN}@github.com/${SEED_REPO}.git" /tmp/seed
            cat /tmp/seed/seed/part-* | tar -x
            rm -rf /tmp/seed
          else
            echo "::error::no cached archives, no backup release and no seed: nothing to start from"; exit 1
          fi
      - name: Refresh, analyse, build, deploy
        id: main
        env:
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}     # the hourly (whale) alerts, after the deploy
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$POSITIONS_JSON" > /tmp/positions.json
          .venv/bin/python scripts/coinboard_ci.py --positions /tmp/positions.json
      - name: Save archives
        uses: actions/cache/save@v6
        with:
          path: data
          key: coinboard-data-${{ github.run_id }}
      - name: Save the holdings list and the summary's facts for the 5-minute alerts
        uses: actions/cache/save@v6
        with:
          path: |
            data/coinboard_held.json
            data/coinboard_facts.json
          key: coinboard-held-${{ github.run_id }}
      - name: Delete older caches (keeps the newest 3 of each kind)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for kind in coinboard-data- coinboard-held- alerts-tick- alerts-price-; do
            gh cache list --key "$kind" --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' |
              while read -r id; do gh cache delete "$id"; done
          done
      - name: Back up archives (when the backup is over 20 hours old, or missing)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          made=$(gh release view archive-backup --json assets --jq '.assets[] | select(.name == "data.tar.zst") | .updatedAt' 2>/dev/null || true)
          if [ -z "$made" ] || [ $(( $(date +%s) - $(date -d "$made" +%s) )) -gt $((20*3600)) ]; then
            tar --exclude=data/coinboard_replay_state.json --exclude=data/coinboard_value_history.json -c data | zstd -T0 -10 -q -o /tmp/data.tar.zst
            gh release view archive-backup >/dev/null 2>&1 || gh release create archive-backup --title "Archive backup" \
              --notes "Daily copy of the trade archives (public chain data) so the hourly job can recover if its cache is lost."
            gh release upload archive-backup /tmp/data.tar.zst --clobber
            echo "backed up $(du -h /tmp/data.tar.zst | cut -f1)"
          fi
      - name: Keep the fallback schedule alive
        if: success()
        continue-on-error: true
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((40*86400)) ]; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -qm "Keep the hourly schedule alive" && git push -q
          fi
