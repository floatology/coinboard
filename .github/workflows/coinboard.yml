name: coinboard
# Hourly: refresh the trade archives, rebuild the analytics and the page, deploy to the private Vercel project.
# Also runs when you press "Refresh analytics" on the page (workflow_dispatch). Needs these repository secrets:
#   POSITIONS_JSON  the owner's positions file (costs and quantities; never committed)
#   VERCEL_TOKEN    Vercel token that can deploy the coinboard project
#   VERCEL_PROJECT  the Vercel project name
#   SEED_REPO, SEED_TOKEN  optional: a fallback source of starting archives if both the cache and the backup release are lost
# The archives live in the Actions cache between runs; a copy is uploaded daily to the "archive-backup" release (public
# chain data only; the replay state with costs is left out). A small commit every ~40 days keeps the schedule enabled
# (GitHub switches off scheduled workflows in public repositories after 60 days without repository activity).
on:
  schedule:
    - cron: "7,27,47 * * * *"   # GitHub drops many scheduled runs when busy; three chances an hour (a newer run cancels an older one)
  workflow_dispatch:
concurrency:
  group: coinboard
  cancel-in-progress: true    # a newer run (new code, the hourly schedule or the page button) replaces an older one
permissions:
  contents: write      # the keep-alive commit and the archive backup release
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q httpx pydantic duckdb pyarrow python-dotenv numpy
      - name: Restore archives
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: coinboard-data-${{ github.run_id }}
          restore-keys: coinboard-data-
      - name: Restore archives from the backup (only if the cache was lost)
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_REPO: ${{ secrets.SEED_REPO }}
          SEED_TOKEN: ${{ secrets.SEED_TOKEN }}
        run: |
          if gh release download archive-backup -p data.tar.zst -D /tmp 2>/dev/null; then
            zstd -dc /tmp/data.tar.zst | tar -x && rm /tmp/data.tar.zst
          elif [ -n "$SEED_TOKEN" ]; then
            git clone -q --depth 1 --branch coinboard-seed "https://x-access-token:${SEED_TOKEN}@github.com/${SEED_REPO}.git" /tmp/seed
            cat /tmp/seed/seed/part-* | tar -x
            rm -rf /tmp/seed
          else
            echo "::error::no cached archives, no backup release and no seed: nothing to start from"; exit 1
          fi
      - name: Refresh, analyse, build, deploy
        env:
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT }}
        run: |
          printf '%s' "$POSITIONS_JSON" > /tmp/positions.json
          .venv/bin/python scripts/coinboard_ci.py --positions /tmp/positions.json
      - name: Save archives
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: coinboard-data-${{ github.run_id }}
      - name: Back up archives (daily, or if there is no backup yet)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ] || ! gh release view archive-backup >/dev/null 2>&1; then
            tar --exclude=data/coinboard_replay_state.json --exclude=data/coinboard_value_history.json -c data | zstd -T0 -10 -q -o /tmp/data.tar.zst
            gh release view archive-backup >/dev/null 2>&1 || gh release create archive-backup --title "Archive backup" \
              --notes "Daily copy of the trade archives (public chain data) so the hourly job can recover if its cache is lost."
            gh release upload archive-backup /tmp/data.tar.zst --clobber
            echo "backed up $(du -h /tmp/data.tar.zst | cut -f1)"
          fi
      - name: Keep the hourly schedule alive
        if: success()
        continue-on-error: true
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((40*86400)) ]; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -qm "Keep the hourly schedule alive" && git push -q
          fi
