name: alerts
# Coin Board's 5-minute tick. cron-job.org starts it through GitHub's API every 5 minutes (on time, unlike GitHub's own
# schedule, which runs late or not at all when busy; that stays below as a fallback). It starts the hourly update
# (coinboard.yml) when due, warns on Telegram if the board stops updating, and runs the 5-minute alerts
# (scripts/coinboard_alerts.py tick: price moves over 6/12/24 hours for held and watchlist coins, liquidity pulls, the
# 08:00 daily summary). The
# holdings list and the summary's facts come from the hourly update through a small cache; the alerts' memory (what
# was sent, the last hour of liquidity readings) is kept in another. Run it by hand with "force update" to start
# the hourly update now.
on:
  workflow_dispatch:
    inputs:
      force_update:
        description: Start the hourly update now
        type: boolean
        default: false
  schedule:
    - cron: "3,23,43 * * * *"   # fallback if cron-job.org stops
concurrency:
  group: alerts
  cancel-in-progress: false
permissions:
  actions: write       # start coinboard.yml
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Start the hourly update if it is due; warn on Telegram if the board has stopped updating
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/coinboard_tick.py
      - name: Holdings and the summary's facts (from the latest hourly update)
        uses: actions/cache/restore@v6
        with:
          path: |
            data/coinboard_held.json
            data/coinboard_facts.json
          key: coinboard-held-${{ github.run_id }}
          restore-keys: coinboard-held-
      - name: The alerts' memory
        uses: actions/cache/restore@v6
        with:
          path: data/alerts_tick.json
          key: alerts-tick-${{ github.run_id }}
          restore-keys: alerts-tick-
      - name: Alerts (price, liquidity, daily summary)
        id: alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}                          # the page's watchlist (read-only)
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
        run: python3 scripts/coinboard_alerts.py tick
      - name: Keep the alerts' memory
        if: steps.alerts.outputs.changed == '1'
        uses: actions/cache/save@v6
        with:
          path: data/alerts_tick.json
          key: alerts-tick-${{ github.run_id }}
