# One-click check that the Telegram bot works: Actions > telegram-test > Run workflow.
# Sends a test message and the bot's profile picture to TELEGRAM_CHAT_ID, or (tick "sample") three made-up alerts.
# Secrets are never printed.
name: telegram-test
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Send three made-up alerts instead
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send a test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAMPLE: ${{ inputs.sample }}
        run: python3 scripts/telegram_notify.py $([ "$SAMPLE" = true ] && echo --sample || echo --test)
