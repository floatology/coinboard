# One-click check that the Telegram bot works: Actions > telegram-test > Run workflow.
# Sends a test message and the bot's profile picture to TELEGRAM_CHAT_ID, or made-up alerts ("samples": all, or numbers).
# Secrets are never printed.
name: telegram-test
on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Send made-up alerts instead: "all", or numbers such as "4" or "1 3" (leave empty for the test message)'
        type: string
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Send a test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          case "$SAMPLES" in
            "") python3 scripts/telegram_notify.py --test ;;
            all) python3 scripts/telegram_notify.py --sample ;;
            *) python3 scripts/telegram_notify.py --sample $(printf '%s' "$SAMPLES" | tr -cs '0-9' ' ') ;;
          esac
