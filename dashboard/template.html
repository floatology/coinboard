<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Avava Labs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0221'/%3E%3Cpath d='M12 44 24 30l9 7 19-21' fill='none' stroke='%232de2e6' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0221;--card:#170735;--chip:#220b47;--line:#3a1866;--ink:#f7eaff;--muted:#bea6dd;--head:#ffffff;--accent:#2de2e6;--teal:#ff6ac1;--aqua:#2a0d55;--glow:rgba(255,42,109,.22);
--gold:linear-gradient(90deg,#ffb300 0%,#ff8a00 55%,#ff5a1f 100%);--up:#4ae8b0;--down:#ff4d5e;--c1:#2b99e7;--c2:#c35c9b;--c3:#d37812;--c4:#5554b6;--brand:linear-gradient(90deg,#2de2e6,#ff2a6d 45%,#ff9a3d 75%,#ffd23f);--display:Orbitron,system-ui,sans-serif;--ui:'Exo 2',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:radial-gradient(70% 40% at 80% 0%,var(--glow),transparent 70%),linear-gradient(180deg,#26084d 0,#0d0221 340px);color:var(--ink);font:15px/1.45 var(--ui);min-height:100vh}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;max-width:1500px;margin:0 auto;padding:18px 16px 4px}
h1{font:700 22px/1 var(--display);color:var(--head);margin:0}h1 span{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.total{text-align:center}.total .big{display:block;font:600 36px/1 var(--display);color:var(--head)}.total .sub{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.actions{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
button{font:600 14px var(--ui);cursor:pointer;border:0;border-radius:10px;padding:9px 16px}
#scan{background:var(--gold);color:#2b1000}#scan:disabled{opacity:.6;cursor:wait}
.small{font-size:11px;color:var(--muted)}
nav{max-width:1500px;margin:6px auto 0;padding:0 16px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
nav button{background:none;color:var(--muted);border-radius:10px 10px 0 0;padding:10px 18px;border-bottom:2px solid transparent}
nav button.on{color:var(--head);border-bottom-color:#2de2e6;background:var(--chip)}
.pos{color:var(--up)}.neg{color:var(--down)}
main{max-width:1500px;margin:0 auto;padding:14px 16px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}header{grid-template-columns:1fr auto}.total{grid-column:1/-1;grid-row:2}.actions{grid-row:1;grid-column:2}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.top{padding:14px 16px 12px}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font:700 21px/1 var(--display);color:var(--head)}.name small{font:500 12px var(--ui);color:var(--muted);margin-left:8px;letter-spacing:.4px;text-transform:uppercase}
.price{font-weight:600;font-size:18px}.pr{display:flex;align-items:baseline;gap:10px}.mcap{color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}@media(max-width:520px){.pr{flex-direction:column-reverse;align-items:flex-end;gap:2px}.mcap{font-size:11px}}
.periods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}@media(max-width:520px){.periods{gap:4px}.periods>*{padding-left:2px!important;padding-right:2px!important;font-size:12px}}
.p{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}.p b{display:block;font-size:11px;font-weight:500;color:var(--muted)}.p span{display:block;font-weight:600;font-size:14px;margin-top:2px}
.roi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.r.main{background:var(--gold);color:#2b1000}.r.main b{color:#4a1d00}.r.main span{color:#2b1000}
.avg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:var(--muted)}.avg b{color:var(--ink);font-weight:600}
.chart{height:340px;border-top:1px solid var(--line);background:#0d0221}.chart iframe{width:100%;height:100%;border:0;display:block}
.x{background:none;color:var(--muted);padding:2px 8px;font-size:18px}
h2{font:600 22px var(--display);color:var(--head);margin:22px 0 10px}
.sold{width:100%;border-collapse:collapse;font-size:13px}.sold th,.sold td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}.sold th:first-child,.sold td:first-child{text-align:left}.sold th{color:var(--muted);font-weight:500}
.ref .periods{margin:10px 0 6px}.ref .mini{padding:0 8px 8px}
.log{font-size:12px;color:var(--muted);margin:8px 0}
.search{display:flex;gap:8px;margin:4px 0 12px}.search input{flex:1;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 14px;font:15px var(--ui);min-width:0}

.horizon::before{content:'';position:absolute;inset:auto 0 0 0;height:46px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 110' preserveAspectRatio='none'><path d='M600 0L-1800 110M600 0L-1650 110M600 0L-1500 110M600 0L-1350 110M600 0L-1200 110M600 0L-1050 110M600 0L-900 110M600 0L-750 110M600 0L-600 110M600 0L-450 110M600 0L-300 110M600 0L-150 110M600 0L0 110M600 0L150 110M600 0L300 110M600 0L450 110M600 0L600 110M600 0L750 110M600 0L900 110M600 0L1050 110M600 0L1200 110M600 0L1350 110M600 0L1500 110M600 0L1650 110M600 0L1800 110M600 0L1950 110M600 0L2100 110M600 0L2250 110M600 0L2400 110M600 0L2550 110M600 0L2700 110M600 0L2850 110M600 0L3000 110' stroke='%23ff2aaa' stroke-width='1.6' fill='none' vector-effect='non-scaling-stroke'/><path d='M0 1.4H1200M0 5.4H1200M0 12.2H1200M0 21.7H1200M0 34.0H1200M0 48.9H1200M0 66.5H1200M0 86.9H1200M0 110.0H1200' stroke='%232de2e6' stroke-width='1.4' fill='none' vector-effect='non-scaling-stroke'/></svg>") center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(rgba(0,0,0,.35),#000 60%);mask-image:linear-gradient(rgba(0,0,0,.35),#000 60%)}
.horizon::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:46px;width:170px;height:84px;border-radius:70px 70px 0 0;background:linear-gradient(180deg,#ffe46b 0%,#ff9a3d 45%,#ff2a6d 100%);-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 62%,transparent 62% 66%,#000 66% 76%,transparent 76% 82%,#000 82% 90%,transparent 90% 100%);mask-image:repeating-linear-gradient(180deg,#000 0 62%,transparent 62% 66%,#000 66% 76%,transparent 76% 82%,#000 82% 90%,transparent 90% 100%);filter:drop-shadow(0 0 22px rgba(255,79,139,.6));opacity:.92}
.palms{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 200'><g fill='%23070112'><path d='M58 200c2-40 4-80 12-118l6 1c-7 37-9 77-10 117z'/><path d='M72 84C55 60 30 55 4 66c22-4 44 2 62 22z'/><path d='M72 84c-6-26-24-44-50-50 20 10 34 28 42 52z'/><path d='M72 84c8-26 26-40 48-42-20 8-34 22-40 44z'/><path d='M72 84c22-14 42-12 48 4-14-8-30-6-44 2z'/><path d='M72 84c-26-6-48 4-60 26 16-14 36-20 58-22z'/></g></svg>"),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 200'><g fill='%23070112'><path d='M58 200c2-40 4-80 12-118l6 1c-7 37-9 77-10 117z'/><path d='M72 84C55 60 30 55 4 66c22-4 44 2 62 22z'/><path d='M72 84c-6-26-24-44-50-50 20 10 34 28 42 52z'/><path d='M72 84c8-26 26-40 48-42-20 8-34 22-40 44z'/><path d='M72 84c22-14 42-12 48 4-14-8-30-6-44 2z'/><path d='M72 84c-26-6-48 4-60 26 16-14 36-20 58-22z'/></g></svg>");background-repeat:no-repeat;background-size:70px auto,56px auto;background-position:left 3% bottom 34px,right 4% bottom 40px}
h1 span{background:var(--brand)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent}
h1{text-shadow:0 0 18px rgba(255,42,109,.55)}.total .big{text-shadow:0 0 18px rgba(255,42,109,.55)}
.card{border-color:rgba(45,226,230,.22);box-shadow:0 0 0 1px rgba(45,226,230,.10),0 12px 30px rgba(0,0,0,.5)}.card:hover{box-shadow:0 0 0 1px #2de2e6,0 0 22px rgba(255,42,109,.30)}
nav button.on{box-shadow:0 1px 12px rgba(45,226,230,.35)}
@media(max-width:520px){.horizon{height:96px}.horizon::after{width:120px;height:60px}.p b{font-size:12px}.palms{background-size:48px auto,40px auto}}
.hero{position:relative;height:190px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .horizon{position:absolute;inset:0;height:auto;border:0}
.hero .horizon::after{width:210px;height:104px;border-radius:90px 90px 0 0}
.hero header{position:relative;z-index:2;background:none;grid-template-columns:1fr auto;padding-top:14px}
.hero .total{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:66px;text-align:center;pointer-events:none;white-space:nowrap}
.hero .total .big{color:rgba(255,255,255,.93);text-shadow:0 0 10px rgba(13,2,33,.85),0 0 22px rgba(255,42,109,.6)}
.hero .total .sub{margin-top:6px}.hero .total .sub b{background:rgba(13,2,33,.62);border-radius:999px;padding:2px 12px;font-size:14px;backdrop-filter:blur(2px)}
@media(max-width:520px){.hero{height:170px}.hero .horizon::after{width:150px;height:76px}.hero .total{bottom:56px}.hero .total .big{font-size:30px}}
h1.logo{margin:0;line-height:0;text-shadow:none}h1.logo img{height:62px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,79,139,.45))}
@media(max-width:520px){h1.logo img{height:46px}}
h1.logo img{height:62px}@media(max-width:520px){h1.logo img{height:36px}}
@media(max-width:820px){.chart{height:400px}}
.chart .ph{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.glance{display:none}
@media(max-width:820px){.glance{display:block;background:var(--card);border:1px solid rgba(45,226,230,.22);border-radius:12px;padding:6px 10px;margin:0 0 12px}
.glance .gr{display:grid;grid-template-columns:1.15fr 64px repeat(4,1fr);gap:4px;align-items:center;padding:3px 0;font-size:12px;line-height:1.2}
.glance .gr+.gr{border-top:1px solid var(--line)}.glance .glock{background:none;border:0;padding:4px 8px 4px 0;margin:-4px 0;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent}.glance .glock.on{color:var(--accent)}.glance .gh{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.glance .gr span{text-align:right;font-weight:600}.glance .gh span{cursor:pointer;padding:4px 0;-webkit-tap-highlight-color:transparent}.glance .gh span.on{color:var(--accent)!important;font-weight:700!important}.glance .gr span.sel{background:rgba(45,226,230,.07);border-radius:4px;padding-right:3px}.glance .gr b{cursor:pointer;text-align:left;font:700 12px var(--display);color:var(--head)}.glance .gh span,.glance .gh b{font-weight:500;color:var(--muted)}}
@media(max-width:360px){.tiles .r{padding:8px 8px}.tiles .r span{font-size:14px}}
@media(max-width:360px){.glance{padding:6px 8px}.glance .gr{grid-template-columns:1.1fr 40px repeat(4,1fr);gap:3px;font-size:11px}.glance .gr b{font-size:11px}}
.hero .vchart{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:8px;width:210px;height:42px;background:rgba(13,2,33,.7);border-radius:8px;padding:3px 6px;display:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero .vchart .vr{position:absolute;left:5px;top:2px;font:700 9px/1 var(--ui);letter-spacing:.04em;color:var(--muted);text-shadow:0 0 3px #0d0221,0 0 3px #0d0221;pointer-events:none}.hero .vchart .vr.inf{font-size:13px;top:0}
@media(max-width:520px){.hero .vchart{width:150px;height:36px;bottom:6px}}
</style>
</head>
<body>
<div class="hero"><div class="horizon"><div class="palms"></div></div><div class="total" id="total"></div><div class="vchart" id="vchart" role="button"></div>
<header>
  <h1 class="logo"><img src="__LOGO__" alt="Avava Labs"></h1>
  <div class="actions"><button id="scan">Scan wallets</button></div>
</header></div>
<nav><button data-tab="portfolio" class="on">Portfolio</button><button data-tab="analytics">Analytics</button><button data-tab="watchlist">Watchlist</button></nav>
<main>
  <section id="tab-portfolio">
    <div class="log" id="scanlog"></div>
    <div class="glance" id="glance"></div>
    <div class="grid" id="grid"></div>
    <h2>Market</h2><div class="grid" id="market"></div>
  </section>
  <section id="tab-analytics" hidden><div class="abar"><span class="small" id="asof"></span><button id="arefresh" class="rbtn">Refresh analytics</button></div><div class="grid" id="agrid"></div></section>
  <section id="tab-watchlist" hidden>
    <div class="search"><input id="q" placeholder="Search a coin name, ticker or contract address" autocomplete="off"><button id="go" style="background:var(--chip);color:var(--ink)">Search</button></div>
    <div class="res" id="res" hidden></div>
    <div class="grid" id="wgrid"></div><p class="small" id="wempty">Nothing here yet. Search for a coin above and press Add.</p>
  </section>
</main>
<footer id="foot"></footer>
<div class="tip" id="tip"></div>
<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
// text from outside (token names and symbols from the chain or DexScreener) is escaped before it goes into the page
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const HOURS = [["1h",1],["6h",6],["12h",12],["24h",24],["1 week",168]];
const fmtUSD = v => "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => v==null||!isFinite(v) ? "n/a" : (v>=0?"+":"−") + Math.abs(v*100).toFixed(1) + "%";
const cls = v => v==null ? "" : (v>=0 ? "pos" : "neg");
const fmtMcap = v => v>=1e9 ? "$"+(v/1e9).toFixed(1)+"B" : v>=1e6 ? "$"+(v/1e6).toFixed(1)+"M" : v>=1e3 ? "$"+Math.round(v/1e3)+"k" : "$"+Math.round(v);
const short = v => v>=1e6 ? (v/1e6).toFixed(1)+"M" : v>=1e3 ? (v/1e3).toFixed(1)+"k" : v.toFixed(0);
function fmtPrice(p){ if(p==null||!isFinite(p)) return "n/a"; if(p>=100) return "$"+p.toFixed(2); if(p>=1) return "$"+p.toFixed(3); if(p>=0.01) return "$"+p.toFixed(4); const e=Math.floor(Math.log10(p)); return "$"+p.toFixed(Math.min(10,2-e+2)); }
const GECKO = {polygon:"polygon_pos",avalanche:"avax",bsc:"bsc",ethereum:"eth"};
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- state ---------- */
let holdings = DATA.coins.map(c=>({...c}));
let closed = DATA.closed.slice();
const saved = store.get("scan",null); if(saved && saved.holdings && saved.at > DATA.built){ const b=new Map(DATA.coins.map(c=>[c.chain+":"+c.token.toLowerCase(),c])); holdings = saved.holdings.map(h=>{ const d=b.get(h.chain+":"+h.token.toLowerCase()); return d?{...h,hist:d.hist,pair:d.pair,bought:d.bought??h.bought}:h; }); closed = saved.closed; }
const prices = {}, hist = {}, info = {};      // by token key
const key = c => c.chain+":"+c.token.toLowerCase();
holdings.forEach(c=>{ if(c.hist) hist[key(c)] = c.hist; });

/* ---------- tiny SVG chart ---------- */
function chart(el, series, o={}){
  const W=o.w||340,H=o.h||130,R=6,T=6,B=16, ys=series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null&&isFinite(v));
  if(!ys.length){ el.innerHTML='<div class="small" style="padding:30px;text-align:center">no data</div>'; return; }
  let lo=o.zero?0:Math.min(...ys), hi=Math.max(...ys); if(hi===lo){hi=lo+1}; const pad=(hi-lo)*0.08; if(!o.zero) lo=(Math.min(...ys)>=0?Math.max(0,lo-pad):lo-pad); hi+=pad;
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])), x0=Math.min(...xs), x1=Math.max(...xs);
  const L=Math.max(30,8+5.6*Math.max(...[0,1,2].map(i=>String((o.fmt||short)(lo+(hi-lo)*i/2)).length)));
  const X=t=>L+(t-x0)/(x1-x0||1)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g="";
  for(let i=0;i<3;i++){ const v=lo+(hi-lo)*i/2, y=Y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#24324f" stroke-width=".5"/><text x="${L-4}" y="${y+3}" text-anchor="end">${(o.fmt||short)(v)}</text>`; }
  [0,.5,1].forEach(f=>{ const t=x0+(x1-x0)*f; g+=`<text x="${X(t)}" y="${H-3}" text-anchor="${f==0?"start":f==1?"end":"middle"}">${new Date(t*1000).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>`; });
  series.forEach((s,i)=>{ const pts=s.pts.filter(p=>p[1]!=null&&isFinite(p[1])); if(!pts.length||s.hidden) return;
    const d=pts.map((p,k)=>(k?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    g+=`<defs><linearGradient id="g${o.id}${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${s.fill??.22}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>`;

let geckoQ = Promise.resolve();
function geckoHist(c){   // hourly closes, 200 candles; queued 2.2 s apart (free limit 30/min)
  const k=key(c), cached=store.get("gh:"+k,null);

// is shown until the refresh arrives, so a refused call (GeckoTerminal's rate limit) leaves the lines as they were
const mins={};
function geckoMinutes(c){
  const k=key(c), cached=store.get("gm:"+k,null), age=cached?Date.now()-cached.t:Infinity;
  if(age<7200000) mins[k]=cached.m;

  geckoQ = geckoQ.then(async()=>{
    try{
      const net=GECKO[c.chain]||c.chain;
      const r=await fetch(`https://api.geckoterminal.com/api/v2/networks/${net}/pools/${c.pair}/ohlcv/minute?aggregate=1&limit=1000&currency=usd&token=${c.token}`,{signal:AbortSignal.timeout(15000)}); const j=await r.json();
      const l=j.data.attributes.ohlcv_list; if(l&&l.length){ mins[k]=l.map(x=>[x[0],x[4]]).sort((a,b)=>a[0]-b[0]); store.set("gm:"+k,{t:Date.now(),m:mins[k]}); renderGlance(); }
    }catch(e){}

// every known price of a coin, oldest first: the hourly history, 1-minute closes where they reach, the live price last
function allPts(c){ const k=key(c), M=mins[k]||[], m0=M.length?M[0][0]:Infinity, p=prices[k]??c.px;
  const a=[...(hist[k]||[]).filter(x=>x[0]<m0),...M]; if(p) a.push([Date.now()/1000,p]); return a; }
// the points of the last h hours, starting with the value carried in at the window's start
function lastHours(a,h){ const t0=Date.now()/1000-h*3600; let start=null; const pts=[];
  for(const x of a){ if(x[0]<t0) start=x[1]; else pts.push(x); } if(start!=null) pts.unshift([t0,start]); return pts; }
function refPrice(c,h){ const t=Date.now()/1000-h*3600, M=mins[key(c)];
  if(M&&M.length&&M[0][0]<=t){ let v=M[0][1]; for(const [ts,pr] of M){ if(ts<=t) v=pr; else break; } return v; }
  const H=hist[key(c)]; if(!H||!H.length) return null; if(H[0][0]>t+3600*2 && h>1) return null; let v=H[0][1]; for(const [ts,pr] of H){ if(ts<=t) v=pr; else break; } return v; }
function periodReturn(c,h,p){ const pc=info[key(c)]?.priceChange, f={1:"h1",6:"h6",24:"h24"}[h];
  if(pc&&f&&pc[f]!=null&&isFinite(pc[f])) return pc[f]/100;
  const ref=refPrice(c,h); return ref&&p?p/ref-1:null; }
function periodsHTML(c){ return HOURS.map(([l])=>`<div class="p"><b>${l}</b><span data-k="p${l}"></span></div>`).join(""); }
function fillPeriods(el,c,p){
  HOURS.forEach(([l,h])=>{ const r=periodReturn(c,h,p), early=c.bought&&(Date.now()/1000-h*3600)<Date.parse(c.bought)/1000;
    const s=el.querySelector(`[data-k="p${l}"]`); if(!s) return; s.textContent=fmtPct(r)+(early?"*":""); s.className=cls(r); });
}

// price line for the glance strip over the period it is sorted by (h hours), coloured like that period's change r
function spark(c,h,r){ const a=allPts(c), win=Math.min(h*600,900); let j=0;
  // each point is the middle of the highest and lowest price in the minutes before it (10 on the 1h line, else 15): on pools
  // with a big fee (WALLET's 1%) buys and sells print about 2% apart, and the raw prices zig-zag between the two
  const sm=a.map((x,i)=>{ while(a[j][0]<x[0]-win) j++; let lo=Infinity,hi=-Infinity; for(let k=j;k<=i;k++){ lo=Math.min(lo,a[k][1]); hi=Math.max(hi,a[k][1]); } return [x[0],(lo+hi)/2]; });
  const all=lastHours(sm,h); if(all.length<2) return "<i></i>";
  const step=Math.ceil(all.length/120), pts=all.filter((_,i)=>i%step===0||i===all.length-1);
  const ys=pts.map(x=>x[1]), t0=pts[0][0], t1=pts.at(-1)[0], W=60, Hh=18;
  const mid=(Math.min(...ys)+Math.max(...ys))/2, span=Math.max(Math.max(...ys)-Math.min(...ys),mid*0.03), lo=mid-span/2;   // at least 3% tall: a quiet hour stays flat
  const X=t=>((t-t0)/(t1-t0||1)*W).toFixed(1), Y=v=>(span?1.5+(1-(v-lo)/span)*(Hh-3):Hh/2).toFixed(1);
  const col=(r!=null?r>=0:ys.at(-1)>=ys[0])?"#4ae8b0":"#ff4d5e";
  return `<i style="display:flex;align-items:center"><svg width="100%" height="${Hh}" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true" style="display:block;overflow:visible"><path d="${pts.map((x,i)=>(i?"L":"M")+X(x[0])+" "+Y(x[1])).join("")}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></i>`; }
// portfolio value over time (recorded by the hourly build) with the live value as the last point, in the banner.
// Tap it to cycle all time (∞) / 30 days / 7 days / 1 day; the timeframe shows in its top left corner
const VR=[["∞",Infinity],["30D",30],["7D",7],["1D",1]]; let vrange=Math.min(+store.get("vrange",0)||0,VR.length-1), vLast=0;
function renderValue(V){ const el=$("#vchart"); if(!el) return; vLast=V; const now=Date.now()/1000, from=now-VR[vrange][1]*86400, all=DATA.vhist||[];
  const pts=all.filter(p=>p[0]>=from), before=all.filter(p=>p[0]<from).at(-1); if(before) pts.unshift([from,before[1]]); if(V>0) pts.push([now,V]);
  if(pts.length<3&&!el.dataset.on){ el.style.display="none"; return; } el.style.display="block"; el.dataset.on=1;
  el.title="Portfolio value, "+{"∞":"all time","30D":"last 30 days","7D":"last 7 days","1D":"last 24 hours"}[VR[vrange][0]]+" (tap to change)";
  if(!el.onclick) el.onclick=()=>{ vrange=(vrange+1)%VR.length; store.set("vrange",vrange); renderValue(vLast); };

  const W=240, H=36, ys=pts.map(p=>p[1]), lo=Math.min(...ys), hi=Math.max(...ys), x0=pts[0][0], x1=pts.at(-1)[0];
  const X=t=>((t-x0)/(x1-x0||1)*W).toFixed(1), Y=v=>(hi===lo?H/2:2+(1-(v-lo)/(hi-lo))*(H-4)).toFixed(1);
  const d=pts.map((p,i)=>(i?"L":"M")+X(p[0])+" "+Y(p[1])).join("");
  el.innerHTML=`<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Portfolio value over time"><defs><linearGradient id="vg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2de2e6" stop-opacity=".35"/><stop offset="1" stop-color="#2de2e6" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#vg)"/><path d="${d}" fill="none" stroke="#2de2e6" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><span class="vr${vrange?"":" inf"}">${VR[vrange][0]}</span>`; }
let gsort=store.get("gsort",24);   // glance strip: sorted from the biggest gain to the biggest loss over this many hours; tap a heading to change
let gorder=store.get("gorder",null);   // the padlock: a locked row order (coin keys) that the period headings no longer change
const PADLOCK=open=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="${open?"M8 11V7a4 4 0 0 1 7.75-1.4":"M8 11V7a4 4 0 0 1 8 0v4"}"/></svg>`;
function renderGlance(){ const G=[["1h",1],["6h",6],["12h",12],["24h",24]], g=$("#glance"); if(!g) return;
  const rows=holdings.map(c=>{ const p=prices[key(c)]??c.px??(hist[key(c)]||[[0,0]]).at(-1)[1];
    return {c,r:Object.fromEntries(G.map(([,h])=>[h,periodReturn(c,h,p)]))}; });
  if(gorder){ const pos=c=>{ const i=gorder.indexOf(key(c)); return i<0?1e9:i; }; rows.sort((a,b)=>pos(a.c)-pos(b.c)); }   // coins bought since go last

  const lock=`<button class="glock${gorder?" on":""}" aria-pressed="${!!gorder}" title="${gorder?"Order locked: tap to sort by the chosen period again":"Tap to lock the coins in this order"}">${PADLOCK(!gorder)}</button>`;

  g.querySelectorAll("[data-gs]").forEach(x=>x.onclick=()=>{ gsort=+x.dataset.gs; store.set("gsort",gsort); renderGlance(); });

  g.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{ const card=document.querySelector(`#grid .card[data-k="${CSS.escape(x.dataset.go)}"]`); const ch=card&&card.querySelector(".chart"); if(ch) ch.scrollIntoView({behavior:"smooth",block:"center"}); }); }
function renderPortfolio(){

  holdings.forEach(c=>{

    chart(el.querySelector('[data-c="grp"]'),[{name:"Whale",color:"#2b99e7",pts:pts(x=>x.whale),fill:.12},{name:"Medium",color:"#c35c9b",pts:pts(x=>x.medium),fill:.06},{name:"Small",color:"#d37812",pts:pts(x=>x.small),fill:.06},{name:"New",color:"#5554b6",pts:pts(x=>x.new),fill:0}],{id:"ag"+c.name,fmt:v=>v.toFixed(1)+"%",zero:true});
    const tv=r.map(x=>x.buy+x.sell), ma=tv.map((_,i)=>{ const w=tv.slice(Math.max(0,i-6),i+1); return w.reduce((a,b)=>a+b,0)/w.length; });
    const k30=Math.max(0,r.length-30), l30=a=>a.slice(k30);   // the 7-day average is computed on the full history, then cut to 30 days
    chart(el.querySelector('[data-c="vol"]'),[{name:"Volume",color:"#ff6ac1",pts:l30(r.map((x,i)=>[x.d,tv[i]])),fill:.25},{name:"7d average",color:"#ffd23f",pts:l30(r.map((x,i)=>[x.d,ma[i]])),fill:0,width:1.2},{name:"Buys",color:"#4ae8b0",pts:l30(pts(x=>x.buy)),hidden:1},{name:"Sells",color:"#ff4d5e",pts:l30(pts(x=>x.sell)),hidden:1}],{id:"av"+c.name,fmt:v=>"$"+short(v),zero:true});
    chart(el.querySelector('[data-c="hold"]'),[{name:"Holders",color:"#ff6ac1",pts:pts(x=>x.holders)}],{id:"ah"+c.name});
  });
}

/* ---------- watchlist ---------- */
let watch = store.get("watch",[]), watchSync=false;
// the watchlist lives on the server when a database is connected (shared by all your devices), else in this browser.
// A browser's first sync merges in what it had; after that the server's list wins (so a coin removed on one device stays
// removed), except for a change this browser could not upload ("wdirty"), which it sends on the next load.
let wseq=0;
const saveWatch=()=>{ store.set("watch",watch); if(!watchSync){ if(store.get("wsynced",0)) store.set("wdirty",1); return; }
  store.set("wdirty",1); const n=++wseq;
  fetch("api/watch",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({watch:watch.map(({chain,token,symbol,pair})=>({chain,token,symbol,pair}))}),signal:AbortSignal.timeout(10000)})
    .then(r=>{ if(r.ok&&n===wseq) store.set("wdirty",0); }).catch(()=>{}); };
async function loadWatch(){ try{ const r=await fetch("api/watch",{signal:AbortSignal.timeout(10000)}); if(!r.ok) return; const j=await r.json();
    const server=j.watch||[], k=c=>c.chain+":"+c.token.toLowerCase(), first=!store.get("wsynced",0);
    let next=server, push=j.watch===null;
    if(first){ const have=new Set(server.map(k)), extra=watch.filter(c=>!have.has(k(c))); next=[...server,...extra]; push=push||extra.length>0; }
    else if(store.get("wdirty",0)){ next=watch; push=true; }
    watchSync=true; store.set("wsynced",1);
    const same=next.map(k).join()===watch.map(k).join(); watch=next;
    if(push) saveWatch(); else store.set("watch",watch);
    if(!same){ buildWatch(); renderWatch(); refresh(); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadWatch(); });   // pick up changes made on another device
function buildWatch(){
  const g=$("#wgrid"); g.innerHTML=""; $("#wempty").style.display=watch.length?"none":"";
  watch.forEach(c=>{
    const el=document.createElement("section"); el.className="card"; el.dataset.k=key(c);
    el.innerHTML=`<div class="top"><div class="row1"><div class="name">${esc(c.symbol)}<small>${esc(c.chain)}</small></div><div><span class="price" data-k="price"></span><button class="x" data-rm="${esc(key(c))}" title="Remove">×</button></div></div>
    <div class="periods">${periodsHTML(c)}</div><div class="roi"><div class="r"><b>Market cap</b><span data-k="mc"></span></div><div class="r"><b>Liquidity</b><span data-k="liq"></span></div><div class="r"><b>24h volume</b><span data-k="vol"></span></div><div class="r main"><b>24h</b><span data-k="d24"></span></div></div></div>
    <div class="chart dx"><iframe data-src="${esc(embed(c))}" title="chart"></iframe></div>`;
    g.appendChild(el); geckoHist(c);
  });
  g.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ watch=watch.filter(c=>key(c)!==b.dataset.rm); saveWatch(); buildWatch(); renderWatch(); });
}
function renderWatch(){
  watch.forEach(c=>{ const el=document.querySelector(`#wgrid .card[data-k="${CSS.escape(key(c))}"]`), i=info[key(c)]; if(!el) return; const p=prices[key(c)]??(i?parseFloat(i.priceUsd):null); if(p==null) return;
    el.querySelector('[data-k="price"]').textContent=fmtPrice(p); fillPeriods(el,c,p);
    if(i){ el.querySelector('[data-k="mc"]').textContent="$"+short(i.fdv||i.marketCap||0); el.querySelector('[data-k="liq"]').textContent="$"+short(i.liquidity?.usd||0); el.querySelector('[data-k="vol"]').textContent="$"+short(i.volume?.h24||0); const d=(i.priceChange?.h24||0)/100; const s=el.querySelector('[data-k="d24"]'); s.textContent=fmtPct(d); } });
}
async function doSearch(){
  const q=$("#q").value.trim(); if(!q) return; const res=$("#res"); res.hidden=false; res.innerHTML='<div>Searching…</div>';
  try{ const j=await (await fetch("https://api.dexscreener.com/latest/dex/search?q="+encodeURIComponent(q))).json();
    const seen=new Set(), ps=(j.pairs||[]).filter(p=>p.liquidity&&p.liquidity.usd>1000).sort((a,b)=>b.liquidity.usd-a.liquidity.usd).filter(p=>{const k=p.chainId+p.baseToken.address.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;}).slice(0,10);
    res.innerHTML=ps.length?ps.map((p,i)=>`<div><span><b>${esc(p.baseToken.symbol)}</b> ${esc(p.baseToken.name)} <span class="small">${esc(p.chainId)} · ${fmtPrice(parseFloat(p.priceUsd))} · liq $${short(p.liquidity.usd)} · 24h ${p.priceChange?.h24??0}%</span></span><button data-i="${i}">Add</button></div>`).join(""):'<div>Nothing found with liquidity.</div>';
    res.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const p=ps[+b.dataset.i]; const c={chain:p.chainId,token:p.baseToken.address,symbol:p.baseToken.symbol,pair:p.pairAddress};
      if(!watch.find(x=>key(x)===key(c))){ watch.push(c); saveWatch(); } info[key(c)]=p; buildWatch(); watchFrames(); renderWatch(); res.hidden=true; $("#q").value=""; });
  }catch(e){ res.innerHTML="<div>Search failed. Try again.</div>"; }
}

/* ---------- scan ---------- */
async function scan(){
  const b=$("#scan"); b.disabled=true; b.textContent="Scanning…"; $("#scanlog").textContent="Reading your wallets on Arc and Robinhood Chain (about 20 seconds)…";
  try{
    const r=await fetch("api/scan",{method:"POST",signal:AbortSignal.timeout(70000)}); const j=await r.json(); if(j.error) throw new Error(j.error);
    const had=new Map(holdings.map(c=>[key(c),c])); const out=[];
    for(const h of j.holdings){
      const k=h.chain+":"+h.token.toLowerCase(), old=had.get(k);
      const pair=await dexToken(h.chain,h.token).catch(()=>undefined);   // undefined: the lookup failed; null: not listed
      if(pair===undefined && !old) continue;                              // new coin and no answer: show it after the next scan
      if(pair===null || (pair && h.qty*parseFloat(pair.priceUsd)<0.5)) continue;   // unlisted or dust: hidden
      const px=pair?parseFloat(pair.priceUsd):(prices[k]??old.px);         // a coin already held is never dropped for a failed lookup
      out.push({name:h.symbol,symbol:h.symbol,chain:h.chain,token:h.token,qty:h.qty,cost:h.cost,soldQty:h.soldQty,soldProceeds:h.soldProceeds,realised:h.realised,pair:old?.pair||pair.pairAddress,bought:old?.bought,hist:old?.hist,px});
    }
    const ord=[...had.keys()]; out.sort((a,b)=>{ const i=ord.indexOf(key(a)), j=ord.indexOf(key(b)); return (i<0?99:i)-(j<0?99:j); });
    const names=a=>a.map(c=>esc(c.symbol)).join(", ")||"none"; const added=out.filter(c=>!had.has(key(c))), gone=[...had.values()].filter(c=>!out.find(o=>key(o)===key(c)));
    const changed=out.filter(c=>had.has(key(c)) && (Math.abs(had.get(key(c)).qty-c.qty)>1e-6*Math.max(1,c.qty) || Math.abs(had.get(key(c)).cost-c.cost)>0.01));
    holdings=out; closed=j.closed.map(x=>({...x,name:x.symbol})); store.set("scan",{holdings,closed,at:j.scannedAt});
    out.forEach(c=>{ prices[key(c)]=c.px; }); buildPortfolio(); holdings.forEach(c=>{ if(!hist[key(c)]) geckoHist(c); }); holdings.forEach(geckoMinutes); render(); AN=AN; buildAnalytics();
    $("#scanlog").innerHTML=`Scan done: <b>${added.length}</b> new (${names(added)}), <b>${gone.length}</b> removed (${names(gone)}), <b>${changed.length}</b> changed (${names(changed)}).`+(j.notes&&j.notes.length?`<br>`+j.notes.map(n=>esc(n.replace(/0x[0-9a-f]{40}/g,s=>s.slice(0,8)+"…"))).join("<br>"):"");
  }catch(e){ $("#scanlog").textContent="Scan failed: "+e.message; }
  b.disabled=false; b.textContent="Scan wallets";
}

/* ---------- wiring ---------- */
function render(){ renderPortfolio(); renderWatch(); renderMarket();
  $("#foot").textContent=`Prices live from DexScreener every 30 s; hourly history from GeckoTerminal; holdings as of ${saved?.at?"your last scan":"the build ("+new Date(DATA.built*1000).toUTCString().slice(5,22)+" UTC)"}. * = held for less than that period (the coin’s move, not yours). Press Scan wallets after any buy or sell.`; }
async function refresh(){
  await Promise.all([...holdings,...watch].map(async c=>{ try{ const p=await dexToken(c.chain,c.token); if(p){ prices[key(c)]=parseFloat(p.priceUsd); info[key(c)]=p; } }catch(e){} }));
  render();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b)); ["portfolio","analytics","watchlist"].forEach(t=>$("#tab-"+t).hidden=t!==b.dataset.tab); if(b.dataset.tab==="analytics") buildAnalytics(); });
$("#scan").onclick=scan;
$("#arefresh").onclick=async()=>{ const b=$("#arefresh"), m=$("#asof"); b.disabled=true; b.textContent="Starting…"; m.classList.remove("asof-ok");
  try{ const r=await fetch("api/refresh",{method:"POST"}), j=await r.json();
    if(r.ok){ b.textContent="Refresh started ✓"; m.textContent="Started at "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+". It takes about 5 to 10 minutes; reload this page after that."; m.classList.add("asof-ok"); setTimeout(()=>{ b.disabled=false; b.textContent="Refresh analytics"; },120000); return; }
    m.textContent=j.error||"Could not start the refresh."; }
  catch(e){ m.textContent="Could not start the refresh."; }
  b.disabled=false; b.textContent="Refresh analytics"; };
 $("#go").onclick=doSearch; $("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });



/* ---------- DexScreener chart frames ----------
   Each DexScreener frame signs in to Firebase and opens a live database connection, and the frames on one page share that
   state. Frames started while off screen (lazy loading, or loading ahead of the scroll) stall on "Loading pair..." and do not
   recover; frames started while on screen load. So: start a frame only when it is at least half visible, and keep only the
   most recently viewed few running (3 on phones, 6 on desktop); older ones are closed and restart when scrolled back to. */
const MAXLIVE=matchMedia("(max-width:820px)").matches?3:6; let live=[];
function stopFrame(f){ delete f.dataset.on; f.removeAttribute("src"); f.srcdoc='<body style="margin:0;background:#0d0221;color:#bea6dd;font:12px sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">Chart paused, scroll to it to reload</body>'; }
function startFrame(f){ live=live.filter(x=>x.isConnected&&x!==f); live.push(f); if(!f.dataset.on){ f.dataset.on="1"; f.removeAttribute("srcdoc"); f.src=f.dataset.src; } while(live.length>MAXLIVE) stopFrame(live.shift()); }
const fobs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting&&e.intersectionRatio>=0.5&&!document.hidden) startFrame(e.target); }),{threshold:[0,0.5,1]});
const _bw=buildWatch, _bp=buildPortfolio, _bm=buildMarket; buildWatch=function(){ _bw(); watchFrames(); }; buildPortfolio=function(){ _bp(); watchFrames(); }; buildMarket=function(){ _bm(); watchFrames(); };
function watchFrames(){ live=live.filter(f=>f.isConnected); document.querySelectorAll("iframe[data-src]").forEach(f=>{ if(!f.dataset.seen){ f.dataset.seen="1"; fobs.observe(f); } }); }
buildPortfolio(); buildMarket(); renderMarket(); buildWatch(); render(); refresh(); setInterval(refresh,30000);
holdings.forEach(c=>{ if(!hist[key(c)]) geckoHist(c); }); holdings.forEach(geckoMinutes); setInterval(()=>holdings.forEach(geckoMinutes),300000); loadMarket(); setInterval(loadMarket,300000); loadWatch();
</script>
